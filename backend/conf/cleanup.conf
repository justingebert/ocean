# Daily job that sends reminders and deletes expired databases.
# Off by default so dev and test never send mail or delete anything.
ocean.cleanup.enabled = false
ocean.cleanup.enabled = ${?OCEAN_CLEANUP_ENABLED}

ocean.cleanup.lifetime-days = 180
ocean.cleanup.lifetime-days = ${?OCEAN_DB_LIFETIME_DAYS}

# Days before expiry at which the owner is reminded.
ocean.cleanup.reminder-days = [30, 7, 1]