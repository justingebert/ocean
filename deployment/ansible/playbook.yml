- name: Firewall on app/db hosts
  hosts: app:pg:mongo
  become: true
  roles:
    - firewall
  tags: firewall

- name: Base setup on app/db hosts
  hosts: app:pg:mongo
  become: true
  roles:
    - base

- name: Stage TLS material on all hosts
  hosts: app:pg:mongo:ops
  become: true
  roles:
    - tls
  tags: tls

- name: Provision ops monitoring
  hosts: ops
  become: true
  roles:
    - ops

# The Beszel agents only accept the hub's key, which the ops role generated.
- name: Hand the Beszel hub key to the agents
  hosts: app:pg:mongo
  gather_facts: false
  tasks:
    - name: Read Beszel hub public key from ops
      ansible.builtin.slurp:
        src: /srv/ocean/beszel/data/id_ed25519.pub
      delegate_to: "{{ groups['ops'][0] }}"
      become: true
      run_once: true
      register: beszel_hub_pubkey_file

- name: Provision pg-vm
  hosts: pg
  become: true
  roles:
    - pg

- name: Provision mongo-vm
  hosts: mongo
  become: true
  roles:
    - mongo

- name: Provision app-vm
  hosts: app
  become: true
  roles:
    - app
