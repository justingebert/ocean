- name: Firewall on app/db hosts
  hosts: app:pg:mongo
  become: true
  roles:
    - firewall
  tags: firewall

- name: Base setup on app/db hosts
  hosts: app:pg:mongo
  become: true
  roles:
    - base

- name: Stage TLS material on all hosts
  hosts: app:pg:mongo:ops
  become: true
  roles:
    - tls
  tags: tls

- name: Provision ops monitoring
  hosts: ops
  become: true
  roles:
    - ops

- name: Provision pg-vm
  hosts: pg
  become: true
  roles:
    - pg

- name: Provision mongo-vm
  hosts: mongo
  become: true
  roles:
    - mongo

- name: Provision app-vm
  hosts: app
  become: true
  roles:
    - app
