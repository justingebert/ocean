- name: Stage docker-compose.yml
  ansible.builtin.copy:
    src: "{{ compose_src }}"
    dest: "/etc/ocean/docker-compose.yml"
    owner: "{{ ocean_user }}"
    group: "{{ ocean_user }}"
    mode: "0640"

- name: Stage compose env file
  ansible.builtin.template:
    src: compose.env.j2
    dest: "/etc/ocean/compose.env"
    owner: "{{ ocean_user }}"
    group: "{{ ocean_user }}"
    mode: "0600"

- name: Validate mongo deploy secret
  ansible.builtin.assert:
    that:
      - ocean_mongodb_cluster_password | length > 0
      - "'change-me' not in ocean_mongodb_cluster_password"
    fail_msg: "Set OCEAN_MONGODB_CLUSTER_PASSWORD before running the mongo role."

- name: Render mongodb_cluster.env
  ansible.builtin.template:
    src: mongodb_cluster.env.j2
    dest: "/etc/ocean/mongodb_cluster.env"
    owner: "{{ ocean_user }}"
    group: "{{ ocean_user }}"
    mode: "0600"
  no_log: true
  diff: false

- name: Create mongodb_cluster data dir
  ansible.builtin.file:
    path: "/srv/ocean/mongodb_cluster/data"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: Bring up mongo compose stack
  community.docker.docker_compose_v2:
    project_src: "/etc/ocean"
    env_files:
      - "/etc/ocean/compose.env"
    state: present
    remove_orphans: true
  tags: compose

- name: Restart MongoDB after TLS change
  community.docker.docker_compose_v2:
    project_src: "/etc/ocean"
    env_files:
      - "/etc/ocean/compose.env"
    state: restarted
    services:
      - mongodb_cluster
  when: tls_material_changed | default(false)
  tags: compose
