# Stage TLS material for the host on /etc/ocean/tls/.
- name: Validate TLS source
  ansible.builtin.assert:
    that:
      - tls_src | length > 0
    fail_msg: "Set OCEAN_TLS_SRC to the directory containing TLS cert/key files."

- name: Ensure TLS dir exists
  ansible.builtin.file:
    path: "/etc/ocean/tls"
    state: directory
    owner: "{{ ocean_user }}"
    group: "{{ ocean_user }}"
    mode: "0755"

- name: Copy server cert (fullchain)
  ansible.builtin.copy:
    src: "{{ tls_src }}/{{ tls_cert_file }}"
    dest: "/etc/ocean/tls/cert.pem"
    owner: "{{ ocean_user }}"
    group: "{{ ocean_user }}"
    mode: "0644"
  register: tls_cert_copy

- name: Copy private key
  ansible.builtin.copy:
    src: "{{ tls_src }}/{{ tls_key_file }}"
    dest: "/etc/ocean/tls/key.pem"
    owner: "{{ tls_key_uid }}"
    group: "{{ tls_key_uid }}"
    mode: "0600"
  register: tls_key_copy
  no_log: true
  diff: false

- name: Record whether TLS material changed
  ansible.builtin.set_fact:
    tls_material_changed: "{{ tls_cert_copy.changed or tls_key_copy.changed }}"

- name: Assemble mongo combined.pem (key + cert)
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', tls_src ~ '/' ~ tls_key_file) }}
      {{ lookup('ansible.builtin.file', tls_src ~ '/' ~ tls_cert_file) }}
    dest: /etc/ocean/tls/combined.pem
    owner: "{{ tls_key_uid }}"
    group: "{{ tls_key_uid }}"
    mode: "0600"
  when: "'mongo' in group_names"
  no_log: true
  diff: false
