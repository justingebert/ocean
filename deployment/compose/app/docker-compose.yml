name: ocean-app

services:
  postgres_orm:
    image: postgres:18.4-alpine
    pull_policy: always
    restart: unless-stopped
    env_file: /etc/ocean/postgres_orm.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/ocean/postgres_orm/data:/var/lib/postgresql

  backend:
    image: ${BACKEND_IMAGE:-ocean-backend:latest}
    pull_policy: ${BACKEND_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file: /etc/ocean/backend.env
    depends_on:
      - postgres_orm

  frontend:
    image: ${FRONTEND_IMAGE:-ocean-frontend:latest}
    pull_policy: ${FRONTEND_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      OCEAN_HOSTNAME: ${OCEAN_HOSTNAME}
    volumes:
      - /etc/ocean/tls:/etc/caddy/tls:ro
      - /etc/ocean/frontend-config.js:/usr/share/caddy/config.js:ro
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

  dozzle_agent:
    image: amir20/dozzle:v11
    pull_policy: always
    restart: unless-stopped
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7007:7007"

  beszel_agent:
    image: henrygd/beszel-agent:0.21.1
    pull_policy: always
    restart: unless-stopped
    network_mode: host # real NIC stats; listens on the host itself, so INPUT chain
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY}
