name: ocean-mongo

services:
  mongodb_cluster:
    image: mongo:8.0
    pull_policy: always
    restart: unless-stopped
    env_file: /etc/ocean/mongodb_cluster.env
    ports:
      - "27017:27017"
    volumes:
      - /srv/ocean/mongodb_cluster/data:/data/db
      - /etc/ocean/tls:/etc/ssl/ocean:ro
    command:
      - mongod
      - --tlsMode=requireTLS
      - --tlsCertificateKeyFile=/etc/ssl/ocean/combined.pem
      - --setParameter=tlsUseSystemCA=true
      - --tlsAllowConnectionsWithoutCertificates
      - --auth

  # Log source for the Dozzle hub on ops; 7007 only reachable from ops (firewall).
  dozzle_agent:
    image: amir20/dozzle:v11
    pull_policy: always
    restart: unless-stopped
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7007:7007"

  beszel_agent:
    image: henrygd/beszel-agent:0.21.1
    pull_policy: always
    restart: unless-stopped
    network_mode: host # real NIC stats; listens on the host itself, so INPUT chain
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY}
